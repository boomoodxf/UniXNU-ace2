name: macOS build

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: UniXNU/UniXNU-sheng
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: Defconfig name
        required: true
        default: sheng_defconfig
      steps:
        description: Steps to run
        type: choice
        options:
          - kernel
          - kernel userdata
          - kernel userdata payload
        default: kernel userdata
      ipsw_url:
        description: IPSW URL (empty uses board.toml)
        required: false
        default: ""
      pre_build:
        description: Optional shell commands run in the UniXNU checkout before the kernel build
        required: false
        default: ""
      trust_cache_url:
        description: Trust cache bundle URL (optional)
        required: false
        default: ""
      owner_trust_cache:
        description: Treat the trust cache URL as an owner-signed bundle
        type: boolean
        default: false
      data_seed_url:
        description: Data seed URL (optional)
        required: false
        default: ""
      grow_gib:
        description: Grow the Data seed to this many GiB (optional)
        required: false
        default: ""
      skip_setup:
        description: Mark Setup as done in the Data seed
        type: boolean
        default: false
      upload_userdata:
        description: Upload the userdata image (large)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  CCACHE_DIR: ~/.ccache

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      # Actions is refused on the build fork, so the pinned base tree comes in
      # over a plain anonymous clone instead of a checkout step.
      - name: Get the pinned UniXNU tree
        run: |
          git clone --depth 1 --branch liuqin-build https://github.com/1696108518/UniXNU.git .
          git log --oneline -1

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --find mig || echo 'mig not found for iphoneos'

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm mtools dtc ccache
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Verify the host tools
        run: |
          for tool in git make clang cmake ninja unifdef mtools dtc xcodebuild; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

      - name: Select the device
        run: |
          ./unixnu defconfig "${{ inputs.defconfig }}" -D "$GITHUB_WORKSPACE/device"
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily -D "$GITHUB_WORKSPACE/device"

      - name: Prepare inputs
        env:
          TRUST_CACHE_URL: ${{ inputs.trust_cache_url }}
          DATA_SEED_URL: ${{ inputs.data_seed_url }}
          GROW_GIB: ${{ inputs.grow_gib }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
        run: |
          if [ -n "$TRUST_CACHE_URL" ]; then
            curl -fL "$TRUST_CACHE_URL" -o "$RUNNER_TEMP/trustcache"
          fi
          if [ -n "$DATA_SEED_URL" ]; then
            curl -fL "$DATA_SEED_URL" -o "$RUNNER_TEMP/data.dbr"
            if [ -n "$GROW_GIB" ]; then
              python3 scripts/seed-data-grow.py --gib "$GROW_GIB" "$RUNNER_TEMP/data.dbr" "$RUNNER_TEMP/data-grow.dbr"
              mv "$RUNNER_TEMP/data-grow.dbr" "$RUNNER_TEMP/data.dbr"
            fi
          elif [ -n "$GROW_GIB" ]; then
            echo "grow_gib needs data_seed_url" >&2
            exit 1
          fi
          if [ "$SKIP_SETUP" = "true" ] && [ ! -f "$RUNNER_TEMP/data.dbr" ]; then
            echo "skip_setup needs data_seed_url" >&2
            exit 1
          fi

      - name: Run pre-build steps
        if: inputs.pre_build != ''
        env:
          PRE_BUILD: ${{ inputs.pre_build }}
          DEVICE_DIR: ${{ github.workspace }}/device
        run: bash -euo pipefail -c "$PRE_BUILD"

      # The tree is reset to pristine before every kernel pass, so without a
      # compiler cache each iteration is a full ~10 minute rebuild. ccache is
      # content addressed, so it survives the reset and only recompiles what
      # actually changed.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.defconfig }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.defconfig }}-

      - name: Point the compiler at ccache
        run: |
          mkdir -p "$HOME/.ccache-bin"
          for tool in clang clang++ cc c++; do
            ln -sf "$(brew --prefix ccache)/bin/ccache" "$HOME/.ccache-bin/$tool"
          done
          echo "$HOME/.ccache-bin" >> "$GITHUB_PATH"
          ccache --max-size=4G
          ccache --set-config=compiler_check=content

      - name: Start every kernel pass from a pristine XNU tree
        run: python3 device/tools/pristine-xnu-work.py

      - name: Build kernel
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          mkdir -p out/liuqin/logs
          set -o pipefail
          ./unixnu build kernel "${args[@]}" 2>&1 | tee out/liuqin/logs/kernel-step.log

      - name: Build userdata
        if: contains(inputs.steps, 'userdata')
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build userdata "${args[@]}"

      - name: Build payload
        if: contains(inputs.steps, 'payload')
        env:
          UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
          OWNER_TRUST_CACHE: ${{ inputs.owner_trust_cache }}
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/trustcache" ]; then
            if [ "$OWNER_TRUST_CACHE" = "true" ]; then
              args+=(--owner-trust-cache "$RUNNER_TEMP/trustcache")
            else
              args+=(--trust-cache "$RUNNER_TEMP/trustcache")
            fi
          fi
          if [ -f "$RUNNER_TEMP/data.dbr" ]; then args+=(--data-ramdisk "$RUNNER_TEMP/data.dbr"); fi
          if [ -n "$UNIQUE_CHIP_ID" ]; then args+=(--unique-chip-id "$UNIQUE_CHIP_ID"); fi
          if [ "$SKIP_SETUP" = "true" ]; then args+=(--skip-setup); fi
          ./unixnu build payload "${args[@]}"

      - name: Upload kernel and payload
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-${{ inputs.defconfig }}
          path: |
            out/*/kernel/**
            out/*/payload/**
            out/*/logs/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload userdata
        if: inputs.upload_userdata && contains(inputs.steps, 'userdata')
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-userdata-${{ inputs.defconfig }}
          path: out/*/userdata/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish outputs (logs, kernel, payload)
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ci"
          mkdir -p "$RUNNER_TEMP/ci/logs" "$RUNNER_TEMP/ci/kernel" "$RUNNER_TEMP/ci/payload"
          cp -f out/liuqin/logs/*.log "$RUNNER_TEMP/ci/logs/" 2>/dev/null || true
          cp -f out/liuqin/kernel/* "$RUNNER_TEMP/ci/kernel/" 2>/dev/null || true
          cp -f out/liuqin/payload/* "$RUNNER_TEMP/ci/payload/" 2>/dev/null || true
          cd "$RUNNER_TEMP/ci" || exit 0
          printf 'run %s\nresult %s\n' "$GITHUB_RUN_ID" "${{ job.status }}" > MANIFEST.txt
          git init -q .
          git -c user.email=ci@local -c user.name=ci add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "outputs of run $GITHUB_RUN_ID"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-out

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            out/*/logs/**
            out/*/tree/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove proprietary inputs
        if: always()
        run: |
          rm -rf out/ipsw out/feeds device/.cache/firmware out/*/tree/.cache/firmware
          rm -f "$RUNNER_TEMP/trustcache" "$RUNNER_TEMP/data.dbr" "$RUNNER_TEMP/data-grow.dbr"
